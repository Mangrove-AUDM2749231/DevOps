name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/myapp:latest

      # ========== 导出你的业务镜像 myapp ==========
      - name: Export myapp image to tar
        run: |
          docker save -o myapp.tar ${{ secrets.DOCKER_USERNAME }}/myapp:latest
      - name: Upload myapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-image
          path: myapp.tar

      # ========== 新增：拉取并导出 python:3.10-slim ==========
      - name: Pull python:3.10-slim
        run: |
          docker pull python:3.10-slim
      - name: Export python slim image to tar
        run: |
          docker save -o python-slim.tar python:3.10-slim
      - name: Upload python-slim artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-slim-image
          path: python-slim.tar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/deploy/myapp
            docker compose pull
            docker compose up -d
            docker system prune -af
